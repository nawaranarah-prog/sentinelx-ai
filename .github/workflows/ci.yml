name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, security, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Static security analysis (bandit)
        run: bandit -q -r app -ll
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Tests (pytest)
        run: pytest --cov=app --cov-report=term-missing:skip-covered

  postgres:
    name: PostgreSQL · migrations & pipeline smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinelx
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinelx" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://sentinelx:ci-only-password@localhost:5432/sentinelx
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      SEED_DEMO_PASSWORD: CiDemoPassword123
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check models and migrations are in sync
        run: alembic check
      - name: Seed demo through the real pipeline
        run: python -m app.seed
      - name: Downgrade to base
        run: alembic downgrade base
      - name: Full test suite on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sentinelx:ci-only-password@localhost:5432/sentinelx
        run: |
          pip install -r requirements-dev.txt
          pytest

  frontend:
    name: Frontend · lint, typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerabilities (npm audit)
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end · Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DATABASE_URL: sqlite:///./e2e.db
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      RATE_LIMIT_AUTH_PER_MINUTE: "200"
      E2E_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
      - name: Build and serve frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npx vite preview --port 4173 --strictPort --host 127.0.0.1 > ../frontend.log 2>&1 &
      - name: Run Playwright
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          mkdir -p screenshots
          npx wait-on -t 60000 http://127.0.0.1:8000/api/health/live http://127.0.0.1:4173 || true
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/test-results
            tests/e2e/screenshots
            backend.log
