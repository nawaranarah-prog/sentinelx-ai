[project]
name = "sentinelx-backend"
version = "1.0.0"
description = "SentinelX AI - SOC platform backend (FastAPI)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = [
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "S101",   # asserts are fine in tests
  "S105", "S106",  # false positives on token/password field names
  "S311",   # random is only used for synthetic demo data
  "E501",
  "B904",
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E402", "B"]
"alembic/*" = ["E402"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
